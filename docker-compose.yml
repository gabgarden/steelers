name: sign-steelers

services:
  steelers:
    build:
      context: ./steelers
      dockerfile: ../Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
    ports:
      - "${PORT:-8080}:3000"
    restart: unless-stopped

  steelers-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./steelers:/app
      - steelers_node_modules:/app/node_modules
    ports:
      - "${DEV_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      NODE_ENV: "development"
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0 -p 3000"

volumes:
  steelers_node_modules:
